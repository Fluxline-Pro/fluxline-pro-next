name: Production - Azure Static Web Apps CI/CD - Production

on:
  push:
    branches:
      - master
  # No branch filter on pull_request: a PR retargeted away from master must still reach
  # this workflow so its preview gets removed. The jobs below gate on the base branch.
  pull_request:
    types: [opened, synchronize, reopened, edited, closed]

# One run at a time per PR. A new push cancels an in-flight preview build, but a close
# queues behind it, so an upload can never land after the preview was deleted (PR #290).
# Only events that can touch this SWA's preview share the PR group: activity on PRs into
# master, and base changes onto or away from master. Everything else (title/body edits, PRs
# into other branches, including ones retargeted away from master) gets a unique group so
# its all-skipped run can't cancel or replace a queued close.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      (github.event_name == 'pull_request' &&
        !((github.event.action != 'edited' && github.base_ref == 'master') ||
          (github.event.action == 'edited' && github.event.changes.base &&
            (github.base_ref == 'master' || github.event.changes.base.ref.from == 'master'))))
      && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.action != 'edited' }}

jobs:
  build_and_deploy_job:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.base_ref == 'master' &&
        (contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action) ||
          (github.event.action == 'edited' && github.event.changes.base)))
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      contents: read
    env:
      ORYX_NODE_VERSION: '22' # Force Oryx to use Node.js 22
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
      - name: Verify Node Version
        run: |
          node --version
          yarn --version
      - name: Install Dependencies
        run: yarn install --frozen-lockfile
      # Azure rejects a staticwebapp.config.json with duplicate routes and aborts the whole upload,
      # which silently freezes the site on its last build. Fail here instead.
      - name: Validate staticwebapp.config.json
        run: yarn jest src/staticwebapp-config.test.ts --ci
      - name: Build Application
        run: yarn build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_ENVIRONMENT: prod
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
          NEXT_PUBLIC_API_BASE_URL: ''
          SITE_URL: 'https://fluxline.pro'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install API Dependencies
        run: cd api && npm install
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: 'upload'
          app_location: 'out'
          api_location: 'api'
          output_location: ''
          skip_app_build: true
          azure_static_web_apps_api_token: ${{ secrets.SWA_API_TOKEN_PROD }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}

  # Deletes the PR's preview environment when the PR closes, or when it is retargeted
  # away from master (otherwise the preview leaks and fills the 3-slot Free-tier quota).
  close_pull_request_job:
    if: >-
      github.event_name == 'pull_request' &&
      ((github.event.action == 'closed' && github.base_ref == 'master') ||
        (github.event.action == 'edited' && github.event.changes.base.ref.from == 'master'))
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    permissions:
      contents: read
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_API_TOKEN_PROD }}
          action: 'close'
          app_location: '/'
